<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Davis & Shirtliff Real Estate Manager — listings, occupancy, rent roll, and tenant operations in one workspace."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12161f" />
    <title>Davis &amp; Shirtliff — Real Estate Manager</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes
      // the wrong colour scheme. Mirrors the logic in ThemeProvider.
      (function () {
        try {
          var themes = ["daylight", "midnight", "terracotta", "forest", "plum", "graphite"];
          var modes = ["light", "dark", "system"];
          var storedTheme = localStorage.getItem("theme");
          var storedMode = localStorage.getItem("color-mode");
          var theme = themes.indexOf(storedTheme) >= 0 ? storedTheme : "daylight";
          var mode = modes.indexOf(storedMode) >= 0 ? storedMode : "system";
          var resolved =
            mode === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : mode;
          var root = document.documentElement;
          root.classList.toggle("dark", resolved === "dark");
          root.style.colorScheme = resolved;
          root.setAttribute("data-theme", theme);
          root.setAttribute("data-mode", resolved);
        } catch (e) {
          /* storage blocked — fall back to the default theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
